; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Verified attached-board routing and combined I2C, with real SD.
[platformio]
default_envs = esp32-s3-storage-bench

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
platform = espressif32 @ 6.10.0 ;
framework = espidf

board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions.csv

build_flags =
    -D CONFIG_FATFS_LFN_HEAP=1
    -D CONFIG_FATFS_MAX_LFN=255
    -D SD_SENSE_ENABLED
    -D CONFIG_LOG_DEFAULT_LEVEL=3

lib_deps = 
    sensors-library
    data-logging-library
    actuators-library
    battery-library

; Isolated hardware diagnostics: SD is never initialized. Normal build unchanged.
[env:esp32-s3-bench]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D EMG8_NO_SD
    -D EMG8_ADC_TIMING

; Detailed SD-free timing comparison (not the default deployment).
[env:esp32-s3-legacy-bench]
extends = env:esp32-s3-bench
build_flags =
    ${env:esp32-s3-bench.build_flags}
    -D EMG8_LEGACY_I2C_BENCH

; Same SD-free acquisition with the detailed per-conversion diagnostics omitted.
[env:esp32-s3-throughput-bench]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D EMG8_NO_SD
    -D EMG8_BENCH_RDY_MAP
    -D EMG8_LEGACY_I2C_BENCH

; Attached hardware, combined transfers, real SD, error-path network counters.
[env:esp32-s3-storage-bench]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D EMG8_BENCH_RDY_MAP
    -D EMG8_LEGACY_I2C_BENCH
    -D EMG8_NET_DIAGNOSTICS
